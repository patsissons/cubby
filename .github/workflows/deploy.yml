# Deploys pb_public, pb_hooks, and pb_migrations to the PocketHost instance
# on every push to main, after verifying that committed build artifacts match
# a fresh build, then power cycles the instance so new hooks, migrations,
# and permalink routes register.
#
# Ships inert in the template: the deploy step runs only when the PHIO_*
# secrets exist. Set PHIO_USERNAME, PHIO_PASSWORD, and PHIO_INSTANCE_NAME in
# repo secrets to enable it. Never touches pb_data.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PHIO_USERNAME: ${{ secrets.PHIO_USERNAME }}
      PHIO_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
      PHIO_INSTANCE_NAME: ${{ secrets.PHIO_INSTANCE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild artifacts
        run: npm run build

      - name: Unit tests (pure Node, no server)
        run: npm test

      - name: Fail if committed artifacts drifted from a fresh build
        run: |
          # -N records intent-to-add so `git diff` sees NEW build outputs too.
          # Without it an uncommitted new bundle is merely untracked, and the
          # gate passes green on a tree that is missing a file every page needs.
          git add -A -N
          git diff --exit-code || {
            echo "::error::pb_public artifacts differ from a fresh build. Run 'npm run build' and commit."
            exit 1
          }

      - name: Deploy via phio
        if: env.PHIO_USERNAME != ''
        env:
          PHIO_DEPLOY_KEY: ${{ secrets.PHIO_DEPLOY_KEY }}
          PHIO_DEPLOY_KEY_PUB: ${{ secrets.PHIO_DEPLOY_KEY_PUB }}
        run: |
          # phio deploys over SFTP with the ed25519 key registered on the
          # PocketHost account. Runners are ephemeral, so restore that key
          # from secrets; without it phio generates a fresh key that the
          # account rejects. phio's CLI runs under a tsx shebang, so tsx
          # must be on PATH too.
          if [ -z "$PHIO_DEPLOY_KEY" ]; then
            echo "::error::PHIO_DEPLOY_KEY / PHIO_DEPLOY_KEY_PUB secrets not set (copy ~/.config/phio-nodejs/phio_deploy_ed25519 and .pub)"
            exit 1
          fi
          mkdir -p ~/.config/phio-nodejs
          printf '%s\n' "$PHIO_DEPLOY_KEY" > ~/.config/phio-nodejs/phio_deploy_ed25519
          printf '%s\n' "$PHIO_DEPLOY_KEY_PUB" > ~/.config/phio-nodejs/phio_deploy_ed25519.pub
          chmod 600 ~/.config/phio-nodejs/phio_deploy_ed25519
          npm install -g phio tsx
          phio deploy -v

      - name: Power cycle the instance
        if: env.PHIO_USERNAME != ''
        run: |
          # Hooks, migrations, and permalink routes register at boot, so a
          # deploy is not fully live until the instance restarts. The
          # PocketHost dashboard's power toggle is PUT /api/instance/{id} on
          # the mothership (a PocketBase app), authenticated with the same
          # account phio uses. The UA header matters: the mothership sits
          # behind Cloudflare rules that reject non-browser agents.
          node - <<'EOF'
          const BASE = 'https://pockethost-central.pockethost.io'
          const HEADERS = {
            'User-Agent': 'Mozilla/5.0 (compatible; cubby-deploy)',
            'Content-Type': 'application/json',
          }
          const die = (msg) => {
            console.error(msg)
            process.exit(1)
          }
          const main = async () => {
            let res = await fetch(`${BASE}/api/collections/users/auth-with-password`, {
              method: 'POST',
              headers: HEADERS,
              body: JSON.stringify({
                identity: process.env.PHIO_USERNAME,
                password: process.env.PHIO_PASSWORD,
              }),
            })
            if (!res.ok) die(`mothership login failed (${res.status})`)
            const { token } = await res.json()
            const auth = { ...HEADERS, Authorization: token }

            const name = process.env.PHIO_INSTANCE_NAME
            const filter = encodeURIComponent(`subdomain='${name}' || cname='${name}'`)
            res = await fetch(`${BASE}/api/collections/instances/records?filter=${filter}`, { headers: auth })
            if (!res.ok) die(`instance lookup failed (${res.status})`)
            const { items } = await res.json()
            if (!items.length) die(`no instance named "${name}" on this account`)
            const id = items[0].id

            const power = async (on) => {
              const r = await fetch(`${BASE}/api/instance/${id}`, {
                method: 'PUT',
                headers: auth,
                body: JSON.stringify({ id, fields: { power: on } }),
              })
              if (!r.ok) die(`power ${on ? 'on' : 'off'} failed (${r.status})`)
              console.log(`power ${on ? 'on' : 'off'} ok`)
            }
            await power(false)
            await new Promise((resolve) => setTimeout(resolve, 5000))
            await power(true)

            // Wake it and confirm it serves before calling the deploy done.
            const url = require('./cubby.config.json').instanceUrl
            for (let attempt = 1; attempt <= 12; attempt++) {
              await new Promise((resolve) => setTimeout(resolve, 5000))
              try {
                const ping = await fetch(`${url}/api/health`, { headers: HEADERS })
                console.log(`health check ${attempt}: ${ping.status}`)
                if (ping.ok) return
              } catch (err) {
                console.log(`health check ${attempt}: ${err.message}`)
              }
            }
            die('instance did not come back after power cycle')
          }
          main()
          EOF

      - name: Deploy skipped (no credentials)
        if: env.PHIO_USERNAME == ''
        run: echo "PHIO_USERNAME secret not set; verified build only. Add PHIO_USERNAME/PHIO_PASSWORD/PHIO_INSTANCE_NAME secrets to enable deploys."
