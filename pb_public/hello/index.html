<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello - Cubby</title>
    <meta name="description" content="The example cubby app: every subsystem on one page." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="Cubby" />
    <meta property="og:title" content="Hello - Cubby" />
    <meta property="og:description" content="The example cubby app: identity, database, files, rooms, and AI on one page." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cubby.pockethost.io/hello/" />
    <meta property="og:image" content="https://cubby.pockethost.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/css/tokens.css?v=2191c209" />
    <link rel="stylesheet" href="style.css?v=ed4b4656" />
    <script src="/js/foundation.js?v=7998ac72" defer></script>
    <script src="/js/markdown.js?v=b6540650" defer></script>
    <script src="app.js?v=6d70940a" defer></script>
  </head>
  <body>
    <main>
      <h1>👋 Hello</h1>
      <p class="tagline">Every cubby subsystem, one page.</p>

      <section id="identity-section">
        <h2>Identity</h2>
        <div id="identity-status">loading...</div>
        <div id="identity-actions"></div>
      </section>

      <section id="guestbook-section">
        <h2>Guestbook</h2>
        <p class="hint">Realtime via cubby.db - open two windows.</p>
        <form id="guestbook-form">
          <input id="guestbook-input" placeholder="leave a message" maxlength="500" required />
          <button type="submit">sign</button>
        </form>
        <ul id="guestbook-list"></ul>
      </section>

      <section id="fs-section">
        <h2>Notes (cubby.fs)</h2>
        <textarea id="note-text" rows="3" placeholder="a note saved to file storage"></textarea>
        <div>
          <button id="note-save">save</button>
          <button id="note-load">load</button>
          <span id="note-status"></span>
        </div>
      </section>

      <section id="markdown-section">
        <h2>Markdown (cubby.markdown)</h2>
        <p class="hint">Write/Preview tabs; paste or drop an image while signed in to upload it.</p>
        <div id="md-editor"></div>
        <span id="md-status"></span>
      </section>

      <section id="rooms-section">
        <h2>Who's here (cubby.rooms)</h2>
        <div id="presence-bar"></div>
        <button id="announce">broadcast a wave 👋</button>
        <ul id="room-log"></ul>
      </section>

      <section id="ai-section">
        <h2>AI (cubby.ai)</h2>
        <button id="ai-greet">ask the AI to greet you</button>
        <blockquote id="ai-output"></blockquote>
      </section>
    </main>
  </body>
</html>
